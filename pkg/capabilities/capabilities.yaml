  - id: greenfield-create-table-apply-the-table-does-not-exist-yet-a-fresh-database-or-a-new-table-in-a-live-one
    area: "declarative_model"
    operation: "Greenfield `CREATE TABLE` apply (the table does not exist yet — a fresh database or a new table in a live one)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    online_safety_detail: "a `REFERENCES` clause takes a brief `SHARE ROW EXCLUSIVE` on each **referenced** live table, under the same lock budget as the `CREATE TABLE`, so a busy referenced table makes the step time out and retry rather than queue writes behind it"
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Desired-state execution creates the table: `CheckTableAbsent` verifies the table relation and composite-type name are free, the executor verifies every relation name the desired file states (explicit index names and first-choice constraint-index and column-sequence names) is free in the schema, and `CheckCreatePrivileges` verifies the role can create there. It then runs the `CREATE TABLE` and index builds as brief bounded steps under the engine's budgets. An occupied claimed name is a typed `create-collision` refusal before execution — drop or rename the occupant, name a constraint's index explicitly, or for a sequence use an explicitly named sequence or a non-serial column. Duplicate-name SQLSTATEs backstop races for explicit names; for server-chosen names, the probe narrows the race to the time-of-check window, and after the `CREATE TABLE` commits the executor reads the constraint-index and sequence names the table actually owns and compares them against the claimed first-choice names — a name taken inside the window makes the server pick a suffixed replacement, which surfaces as a typed `create-name-mismatch` failure at step 1 with the born table left in place for an operator to rename the relation or drop, then re-diff (a read of the owned names that does not complete is the same step-1 failure as `create-names-unverified`, never a pass). `PARTITION OF`, `INHERITS`, `LIKE`, `OF`, `IF NOT EXISTS`, and in-set duplicate names refuse at plan time and are re-checked at apply, while `CONCURRENTLY` is refused upstream at desired-file parse and re-checked at admission as defense in depth"
  - id: extension-objects-named-unqualified-in-a-desired-file
    area: "declarative_model"
    operation: "Extension types, functions, and operators named unqualified in a desired file (such as `citext` installed in an `extensions` schema)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "A desired file resolves names against the target schema and `public` only, so an extension installed elsewhere is named qualified (`extensions.citext`) unless `--extension-schema` (Go: `DesiredSchema.WithExtensionSchemas`) names its schema. Those schemas are searched after the target schema and `public` when the scratch build and the create path run the file, and never shadow a name either one defines. The model is introspected without them, so each such object prints qualified on both sides, and every planned statement on an existing table names the object it resolved to. A table that does not exist yet is created from the file's own statements under the same search path; the plan report lists the schemas in `extension_schemas`, its fingerprint covers them, and `diff --sql` sets that search path before the create. Opt-in, because with more schemas searched an unqualified function call can resolve to a different overload. In a row-security file the schemas apply to the table definition only (Go: `DesiredWithRowSecurity.WithExtensionSchemas`), and a missing table's create preview lists them in `extension_schemas`; policy expressions still resolve nothing but the table and the built-ins, so they name every such object qualified"
  - id: enum-typed-columns-on-plain-tables
    area: "types_and_non_table_objects"
    operation: "Enum-typed columns on plain tables"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "An enum column is an ordinary column to both front doors: adding one (with a constant default it is catalog-only), changing its default, and indexing it run natively, and a desired file can create a table with one. A desired file names an enum in the table's schema or `public` bare; introspection renders the live column through `format_type`, so the file and the live table compare equal and a rerun plans nothing. The enum type is created with owner tooling; after that its labels can be declared in a desired enum type file, or added with `ALTER TYPE ... ADD VALUE`. Retyping a column to or from an enum rewrites the table and runs on copy-and-swap (preview, opt-in)"
  - id: alter-type-add-value
    area: "types_and_non_table_objects"
    operation: "`ALTER TYPE ... ADD VALUE`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only: the statement writes one `pg_enum` row under a lock on the type alone, so no table that uses the type is locked, scanned, or rewritten, and reads and writes on those tables carry on while it runs. It waits only for another session altering the same type, under the brief budgets with lock-timeout retry. `BEFORE`, `AFTER`, and `IF NOT EXISTS` run as written; a position next to the empty label is refused as `unsupported-statement`, since the parse tree cannot carry it. `migrate` resolves the type on the session `search_path`, checks that it is an enum, that the role has `USAGE` on a schema the name spells, and that the role is a member of the type's owning role (else `insufficient-privileges`), pins the attempt's `search_path` to the type's schema, and confirms before the commit that every label the transaction wrote belongs to that type, or, when `IF NOT EXISTS` wrote nothing, that the name still resolves to it, since `ALTER TYPE ... RENAME` does not wait for the lock and another session can move the name meanwhile (else the permanent `enum-type-drift` code, nothing added). A statement that meets a label the type already carries, or a `BEFORE` or `AFTER` label the type no longer carries, returns the permanent `enum-label-exists` or `enum-neighbor-missing` code, nothing added. Sessions can use the new value once it commits. `--force`, `--allow-destructive`, and the copy-and-swap acknowledgements do not apply. A desired enum type file holds one unqualified `CREATE TYPE ... AS ENUM`; `diff` plans an `ADD VALUE` (kind `add-enum-value`) for each label it lists that the live type lacks, `BEFORE` the next live label for an insert ahead of one, and `migrate --desired` runs each through the same checks, then re-plans to confirm nothing is left. Labels must be distinct and non-empty"
  - id: enum-value-rename-removal
    area: "types_and_non_table_objects"
    operation: "Enum value rename / removal"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "PostgreSQL has no `DROP VALUE`; this is a type swap + table rewrite, planned on copy-and-swap. Today the imperative door refuses `ALTER TYPE ... RENAME VALUE` as `unsupported-statement`, since the only `ALTER TYPE` form it takes is `ADD VALUE`, and `DROP VALUE` does not parse. A desired enum type file that no longer lists a live label is refused as `unsupported-statement` for the direct operator, who renames the label with `ALTER TYPE ... RENAME VALUE` or keeps it in the file; one that lists the live labels in another order is refused by design, since PostgreSQL cannot move a label"
