  - id: declarative-row-security-library
    area: "types_and_non_table_objects"
    operation: "Complete table-local RLS definition (Go API and migrate --desired)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "The [atomic RLS executor](atomic-row-security.md) locks an existing supported table, refuses structural changes, replaces policies/settings, and verifies convergence before committing. Go callers can preview the ordered SQL and require it to match under lock before execution. This is a SQL review contract, not a catalog snapshot. Lock waits and the whole transaction are bounded. When the table does not exist, `migrate --desired` creates it with its RLS in one transaction, so it is never visible without its policies. When the live RLS already matches the file and only the table definition differs, `migrate --desired` (Go: `migrate.RunDesiredWithRowSecurity`) runs the ordinary table plan, never writes a policy, and reports executed only when a fresh plan, RLS included, is empty. Available through `migrate --desired` without RLS-specific flags; `diff` remains a review-only surface for existing tables and previews the create for a missing one"
