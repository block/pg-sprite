rows:
  - id: add-column-no-default-or-constant-default
    area: "column_changes"
    operation: "`ADD COLUMN` (no default, a constant default, or a non-volatile default such as `now()`)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only / fast default (PG 11+), proven by adding the column to an empty temporary table first; executes instantly under bounded locks"
  - id: add-column-with-volatile-default-now-gen-random-uuid
    area: "column_changes"
    operation: "`ADD COLUMN` with volatile default (`gen_random_uuid()`, `clock_timestamp()`, identity, `serial`, …)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite; routes to copy-and-swap, which does not carry a volatile default yet (the shadow fill would have to evaluate the default per row and the stream would have to agree)"
  - id: add-column-of-a-domain-with-constraints
    area: "column_changes"
    operation: "`ADD COLUMN` of a domain type with a `CHECK` or `NOT NULL`, with or without a default"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite to check every row against the domain; routes to copy-and-swap, which does not carry an added column yet (the shadow fill and the stream would each fill it from the default)"
  - id: add-column-generated-stored
    area: "column_changes"
    operation: "`ADD COLUMN ... GENERATED ... STORED`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite; routes to copy-and-swap, which does not carry stored generated columns yet — the copy must **recompute, never copy,** them on the shadow table"
  - id: alter-column-set-expression
    area: "column_changes"
    operation: "`ALTER COLUMN ... SET EXPRESSION` (changed stored generated expression)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Planned but not executed. `diff` shows a changed stored generated expression as one `SET EXPRESSION` statement of kind `set-generated-expression`, refused with `unsupported-statement`, rather than a drop and re-add that would also drop the column's indexes. It recomputes every row under `ACCESS EXCLUSIVE`, and the statement needs PostgreSQL 17 or later"
  - id: add-column-with-inline-unique-primary-key-references-check
    area: "column_changes"
    operation: "`ADD COLUMN` with inline `UNIQUE`/`PRIMARY KEY`/`REFERENCES`/`CHECK`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: not-native-safe-rewrite-required
    reason_notes: "The inline constraint does its index build or validation scan under the `ADD COLUMN`'s `ACCESS EXCLUSIVE` lock; refused with guidance to add the column first, then build the constraint online"
  - id: drop-column
    area: "column_changes"
    operation: "`DROP COLUMN`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only; flagged **destructive** in the plan report. Refused with `replica-identity` when a replica identity index the drop reaches keys on the column: the table's own, or one on a partition or inheritance child below it unless the statement says `ONLY`"
  - id: alter-column-type-binary-coercible-proven-against-live-column-facts
    area: "column_changes"
    operation: "`ALTER COLUMN TYPE`, binary-coercible (proven against live column facts)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Catalog relabel, e.g. `varchar(50)` → `varchar(100)`, `varchar` → `text`; PostgreSQL itself refuses the change when a view, rule, or `STORED` generated column depends on the column — see [binary-coercible-type-changes.md](binary-coercible-type-changes.md#no-rewrite-is-not-no-cost)"
  - id: alter-column-type-general-or-with-using
    area: "column_changes"
    operation: "`ALTER COLUMN TYPE`, general (or with `USING`)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Table rewrite; runs through copy-and-swap: the changed shape is built as a shadow table, filled in chunks (a `USING` expression is applied per row), verified, and swapped in under the source's name. The route's preflight still refuses table shapes and environments it cannot run against (`copy-and-swap-refused`), and a `USING` expression is admitted only when the copy can reproduce it: immutable, naming only the retyped column, not the primary key (`shadow-statement-conversion`) — see [limitations.md](limitations.md)"
  - id: set-default-drop-default-drop-not-null
    area: "column_changes"
    operation: "`SET DEFAULT` / `DROP DEFAULT` / `DROP NOT NULL`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only"
  - id: set-not-null
    area: "column_changes"
    operation: "`SET NOT NULL`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Executed as the native four-step pattern: `ADD CONSTRAINT ... CHECK (col IS NOT NULL) NOT VALID` → online `VALIDATE` → `SET NOT NULL` (catalog flip, PG 12+) → drop the scaffold check"
  - id: rename-column-rename-table
    area: "column_changes"
    operation: "`RENAME COLUMN` / `RENAME TABLE`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only for PostgreSQL but **app-breaking** across deployed instances; executed with a typed reason so lint/plan consumers can steer away"
  - id: set-tablespace
    area: "column_changes"
    operation: "`SET TABLESPACE`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Physical relocation is a rewrite; routes to copy-and-swap, which does not carry a tablespace move yet"
  - id: add-primary-key-add-unique-plain-key-columns
    area: "constraints"
    operation: "`ADD PRIMARY KEY` / `ADD UNIQUE` (plain key columns)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Rewritten to the online sequence: `CREATE UNIQUE INDEX CONCURRENTLY` → `ADD CONSTRAINT ... USING INDEX`. The sequence carries the key's `INCLUDE` columns, `NULLS NOT DISTINCT`, `WITH (...)` storage parameters, and index tablespace onto the index, and `DEFERRABLE` / `INITIALLY DEFERRED` onto the attach. A storage parameter the sequence cannot render faithfully (a value that is not a plain word, number, or string, a value containing a backslash, or a namespaced parameter name) gets no rewrite and is refused as `rewrite-required` with the `unique-index-then-constraint` guidance: build the index with it, then attach it. In a desired file, a new key whose name and index match a valid live unique index takes that index over with `ADD CONSTRAINT ... USING INDEX` at the key's declared deferrability, instead of a destructive drop and rebuild. Execution reads the index again under the table's lock and refuses with the permanent `adopted-index-drift` code, attaching nothing, if it was dropped, replaced, or left invalid since planning"
  - id: add-check-add-foreign-key-imperative
    area: "constraints"
    operation: "`ADD CHECK` / `ADD FOREIGN KEY` (imperative)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Rewritten to the online sequence: `ADD CONSTRAINT ... NOT VALID` (brief metadata lock) → `VALIDATE CONSTRAINT` (writes keep flowing during the scan)"
  - id: add-constraint-not-valid-using-index-validate-constraint
    area: "constraints"
    operation: "`ADD CONSTRAINT ... NOT VALID` / `... USING INDEX` / `VALIDATE CONSTRAINT`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Already the online idiom; executed as-is"
  - id: add-foreign-key-not-valid-on-a-partitioned-parent
    area: "constraints"
    operation: "`ADD FOREIGN KEY ... NOT VALID` on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    online_safety_problem: true
    online_safety_detail: "server version 18 or later"
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Supported on version 18 and later; refused on 14–17 with an environmental class"
  - id: exclude-constraints-and-unrecognized-constraint-forms
    area: "constraints"
    operation: "`EXCLUDE` constraints (and unrecognized constraint forms)"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "unsolvable today"
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "No online pattern exists in PostgreSQL — the build scans under `ACCESS EXCLUSIVE` with no `NOT VALID`/`USING INDEX` equivalent. Refused; revisit only if PostgreSQL grows one"
  - id: drop-constraint
    area: "constraints"
    operation: "`DROP CONSTRAINT`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only; flagged **destructive**. Refused with `replica-identity` when the constraint owns the table's replica identity index, or the index a partition's is attached under"
  - id: create-unique-index-on-a-plain-table-including-partial-expression-covering-include-gin-gist-brin
    area: "indexes"
    operation: "`CREATE [UNIQUE] INDEX` on a plain table — including partial, expression, covering (`INCLUDE`), GIN/GiST/BRIN"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Executed as (or rewritten to) `CREATE INDEX CONCURRENTLY`, with validity verification, typed invalid-index outcomes, and a proven recovery for abandoned leftovers (`RebuildAbandonedIndex`, or `DropAbandonedIndex` to remove the leftover without rebuilding; both library-only; [runbook](invalid-index-recovery.md))"
  - id: drop-index
    area: "indexes"
    operation: "`DROP INDEX`"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "the online form is a direct `CONCURRENTLY` statement that `migrate` does not drive"
    front_doors:
      migrate: refused
      diff: supported
    refusal_reason: index-statement
    reason_notes: "`migrate` never runs this statement online-safely: the plain form is refused and names `DROP INDEX CONCURRENTLY`, and the concurrent form is refused as already safe — run it directly against the database. A single-index plain `DROP INDEX` can be run as-is under bounded budgets with `--accept-blocking SCHEMA.TABLE` (exit 3, never 0); `--accept-blocking` checks the replica identity under the table's lock and refuses the drop as `unsupported-statement`, naming the identity index. `diff` reports an index to remove as a **destructive** `DROP INDEX` and hints to run it through `migrate --alter`, which ends in this `index-statement` refusal — run `DROP INDEX CONCURRENTLY` directly instead. `diff` refuses dropping the table's replica identity index, or one a partition's is attached under, with `replica-identity`"
  - id: reindex
    area: "indexes"
    operation: "`REINDEX`"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "the online form is a direct `CONCURRENTLY` statement that `migrate` does not drive"
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: index-statement
    reason_notes: "`migrate` never runs this statement online-safely: the plain form is refused and names `REINDEX ... CONCURRENTLY`, and the concurrent form is refused as already safe — run it directly against the database. A plain `REINDEX INDEX` or `REINDEX TABLE` can be run as-is under bounded budgets with `--accept-blocking SCHEMA.TABLE` (exit 3, never 0). `REINDEX SCHEMA`, `DATABASE`, and `SYSTEM` stay refused. A desired schema cannot express a reindex, so `diff` never produces one"
  - id: index-build-on-a-partitioned-parent
    area: "indexes"
    operation: "Index build on a **partitioned parent**"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-partitioned-parent
    reason_notes: "PostgreSQL has no parent-level `CONCURRENTLY`; the blocking form is refused by policy (`--force` does not bypass it, and `--accept-blocking` does not reach it yet). The partition-aware flow — `CREATE INDEX ON ONLY` → per-partition CIC → `ATTACH PARTITION`, with crash-resume per leaf — is planned"
  - id: add-constraint-using-index-on-a-partitioned-parent
    area: "indexes"
    operation: "`ADD CONSTRAINT ... USING INDEX` on a partitioned parent"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "unsolvable today"
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-partitioned-parent
    reason_notes: "PostgreSQL does not support adopting an index on a partitioned parent in any supported version; refused before execution"
  - id: create-table-partition-of
    area: "partitioned_tables"
    operation: "`CREATE TABLE ... PARTITION OF`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal at both doors: the imperative door does not take `CREATE TABLE`, and the declarative create path refuses the form at plan time and re-checks it at apply — attaching a partition takes a brief `ACCESS EXCLUSIVE` on the **parent**, which the greenfield absence proof does not cover. A desired file for a partition that already exists is refused before planning builds anything, since the scratch build would attach to the live parent. The partition-aware flow is planned"
  - id: attach-partition
    area: "partitioned_tables"
    operation: "`ATTACH PARTITION`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: not-native-safe-rewrite-required
    reason_notes: "Without `--force`, a typed refusal with nothing executed: the attach scans the partition to validate its bound unless a validated `CHECK` already proves it, and the engine does not yet construct that proof. The safer idiom (pre-prove the bound with a validated `CHECK` so the attach skips its scan) is surfaced as guidance. `--force SCHEMA.TABLE` runs the blocking `ATTACH PARTITION` as submitted under bounded budgets, taking the blocking lock, and records the override. The classify-first flow that constructs the proof itself is planned. A desired schema cannot express an attach, so `diff` never produces one"
  - id: detach-partition-concurrently
    area: "partitioned_tables"
    operation: "`DETACH PARTITION [CONCURRENTLY]`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: unsupported-statement
    reason_notes: "`CONCURRENTLY` is the idiom and the blocking form is rewritten to it (`--dry-run` and `suggest` show the rewrite), but without `--force` `migrate` refuses both forms before anything executes: a cancelled concurrent detach leaves a detach-pending partition state the executor does not yet own recovering. `--force SCHEMA.TABLE` runs a plain `DETACH PARTITION` as submitted under bounded budgets, taking the blocking lock; `DETACH ... CONCURRENTLY` stays refused under `--force`. `migrate --dry-run` of either form reports the rewrite as a safer sequence to run and exits 0 while the real run refuses and exits 2, so the dry-run exit code is not a submit gate for a detach. A desired schema cannot express a detach, so `diff` never produces one"
  - id: partitioned-parents-in-the-declarative-model
    area: "partitioned_tables"
    operation: "Partitioned parents in the **declarative model**"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal: the model does not yet carry partition keys, and rendering a partitioned parent as a plain `CREATE TABLE` would be silently wrong"
  - id: partitioned-tables-in-copy-and-swap
    area: "partitioned_tables"
    operation: "Partitioned tables in **copy-and-swap**"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Root-vs-leaf publication semantics and per-partition swap; the copy-and-swap preflight refuses a partitioned source"
  - id: plain-tables-their-indexes
    area: "declarative_model"
    operation: "Plain tables + their indexes"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "`diff`, `pull`, and desired-file rendering round-trip the canonical model. The model carries each index's validity (`pg_index.indisvalid`): on a plain table an invalid entry is a concurrent build that did not finish — abandoned, or still running — so a live entry with the desired name and definition does not deliver the desired index, and `diff` plans it as a `create-index` change. `diff` never emits a drop for an invalid entry, whatever the desired file says about its name: a plain `DROP INDEX` blocks the table and cannot tell abandoned debris from a build still in progress. A `pull`ed baseline of such a table therefore re-diffs to that one rebuild rather than to zero. On a partitioned parent an invalid index means unattached partition indexes, not an unfinished build, so validity plays no part in the parent's comparison"
  - id: declarative-not-valid-constraint
    area: "declarative_model"
    operation: "A live check constraint or foreign key left `NOT VALID`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "The model carries each constraint's validity (`pg_constraint.convalidated`). A live constraint left `NOT VALID` with the desired definition, which an interrupted online add leaves behind, plans as one `VALIDATE CONSTRAINT` statement (`validate-constraint`), which scans under `SHARE UPDATE EXCLUSIVE` while writes keep flowing, instead of a destructive drop and re-add. The statement names only the constraint, so execution reads the constraint again under that same lock and refuses with the permanent `validated-constraint-drift` code, validating nothing, if it was dropped or replaced under the same name since planning. A foreign key plans as `validate-foreign-key`, refused with `declarative-foreign-key` like every declarative foreign-key change. `CREATE TABLE` ignores `NOT VALID`, so a desired file cannot declare it: for a check constraint, `pull` renders the validated definition, and the baseline re-diffs to that one validation rather than to zero. `pull` refuses a table that owns a foreign key, validated or not, with `ErrUnrenderableForeignKey`"
  - id: classic-table-inheritance-inherits
    area: "declarative_model"
    operation: "Classic table inheritance (`INHERITS`)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal for both parents and children: the model cannot express inheritance edges, and flattening inherited columns would produce a silently lossy baseline. A desired file that declares `INHERITS` is refused before planning builds anything, since the scratch build would lock the live parent and add an inheritance edge to it"
  - id: tables-that-own-or-are-referenced-by-foreign-keys
    area: "declarative_model"
    operation: "Tables that own **or are referenced by** foreign keys"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: declarative-foreign-key
    reason_notes: "Planned but not executed. A desired file may declare a foreign key to an unqualified table that exists in the target schema; `diff` shows a matching foreign key as no change and an added or dropped one as an `add-foreign-key` or `drop-foreign-key` statement refused with `declarative-foreign-key`, and `migrate --desired` refuses the whole plan. Planning binds each reference to an empty scratch copy of the live table, which needs `SELECT` on it, so planning takes only `ACCESS SHARE` on the live referenced table, the lock a plain `SELECT` takes, and never blocks its writes. Export still refuses both sides — an incoming FK cannot be expressed in the table's own desired file. Declarative FK execution (composite keys as the primary case, two-phase `NOT VALID` → `VALIDATE` execution) is planned"
  - id: unlogged-tables
    area: "declarative_model"
    operation: "Unlogged tables"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal: persistence is not modeled, converging it (`SET LOGGED`) is a full rewrite, and rendering the table as plain `CREATE TABLE` would silently change crash-safety"
  - id: explicit-column-collations
    area: "declarative_model"
    operation: "Explicit column collations"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal: dropping a `COLLATE` clause from a rendered baseline silently changes sort order and index semantics; a collation delta cannot converge without a rewrite"
  - id: table-storage-parameters
    area: "declarative_model"
    operation: "Table storage parameters (`WITH (fillfactor = ...)`, `toast.*`)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Modeled, exported, and compared, but not converged. `pull` writes a table's storage parameters, its TOAST table's included, back as a `WITH` clause, and a table whose file declares the live parameters plans the rest of its changes normally. A difference in either direction is a typed `diff` refusal: a parameter the file declares is never reported as applied, and a tuned live parameter the file omits is never reported as matching. A table with no column that needs a TOAST table has none, and the server discards `toast.*` parameters set on it, so a file that declares one alongside a newly added text-like column refuses too"
  - id: column-owned-sequence-declarations
    area: "declarative_model"
    operation: "Identity and serial sequences declared away from the defaults (`START WITH`, `MAXVALUE`, ...)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Modeled and compared, but not converged. An identity's declaration round-trips: `pull` writes it as the column's options clause, an added identity column carries it, and a file that states the live declaration plans the rest of its changes normally, while a difference in either direction is a typed `diff` refusal. A serial's declaration cannot be stated by the serial shorthand, so export refuses a serial whose sequence is declared otherwise, including an integer serial whose column was widened to `bigint` while its sequence stayed `integer`. A sequence's current position is data, not schema, and is never compared"
  - id: virtual-generated-columns
    area: "declarative_model"
    operation: "Virtual generated columns (PostgreSQL 18+)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal: the desired-file grammar cannot declare `VIRTUAL`, export refuses a live virtual column, and a desired file that declares it any other way fails the diff, so a virtual expression is never converged as a column default"
  - id: columns-whose-default-uses-a-sequence-the-column-does-not-own
    area: "declarative_model"
