rows:
  - id: add-column-no-default-or-constant-default
    area: "column_changes"
    operation: "`ADD COLUMN` (no default, a constant default, or a non-volatile default such as `now()`)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only / fast default (PG 11+), proven by adding the column to an empty temporary table first; executes instantly under bounded locks. A `NOT NULL` column with no default, whether `NOT NULL` is spelled or comes from its domain or an inline `PRIMARY KEY`, is refused with `not-null-without-default` when the table holds rows, which PostgreSQL would refuse"
  - id: add-column-with-volatile-default-now-gen-random-uuid
    area: "column_changes"
    operation: "`ADD COLUMN` with volatile default (`gen_random_uuid()`, `clock_timestamp()`, identity, `serial`, …)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite; routes to copy-and-swap, which does not carry a volatile default yet (the shadow fill would have to evaluate the default per row and the stream would have to agree). An identity or `serial` column is further refused at the shadow build itself with `shadow-statement-new-sequence`, as a sequence the swap cannot carry to the live table — the engine's guard for library callers that reach the build without this route check — see [limitations.md](limitations.md)"
  - id: add-column-of-a-domain-with-constraints
    area: "column_changes"
    operation: "`ADD COLUMN` of a domain type with a `CHECK` or `NOT NULL`, with or without a default"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite to check every row against the domain; routes to copy-and-swap, which does not carry an added column yet (the shadow fill and the stream would each fill it from the default). A library caller that reaches the shadow build with a domain that refuses NULL and has no default is refused there with shadow-statement-new-column"
  - id: add-column-generated-stored
    area: "column_changes"
    operation: "`ADD COLUMN ... GENERATED ... STORED`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Table rewrite; routes to copy-and-swap, which does not carry stored generated columns yet — the copy must **recompute, never copy,** them on the shadow table"
  - id: alter-column-set-expression
    area: "column_changes"
    operation: "`ALTER COLUMN ... SET EXPRESSION` (changed stored generated expression)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Planned but not executed. `diff` shows a changed stored generated expression as one `SET EXPRESSION` statement of kind `set-generated-expression`, refused with `unsupported-statement`, rather than a drop and re-add that would also drop the column's indexes. It recomputes every row under `ACCESS EXCLUSIVE`, and the statement needs PostgreSQL 17 or later"
  - id: add-column-with-inline-unique-primary-key-references-check
    area: "column_changes"
    operation: "`ADD COLUMN` with inline `UNIQUE`/`PRIMARY KEY`/`REFERENCES`/`CHECK`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: not-native-safe-rewrite-required
    reason_notes: "The inline constraint does its index build or validation scan under the `ADD COLUMN`'s `ACCESS EXCLUSIVE` lock; refused with guidance to add the column first, then build the constraint online"
  - id: drop-column
    area: "column_changes"
    operation: "`DROP COLUMN`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only; flagged **destructive** in the plan report. `migrate` refuses it with `destructive-change` unless `--allow-destructive` names the table (`migrate --desired` refuses a destructive plan whole unless `--expect-fingerprint` pins the reviewed plan and `--allow-destructive` names the table); dropping a column and adding it back in one statement is refused with the `alter-column-type-in-place` guidance. Refused with `replica-identity` when a replica identity index the drop reaches keys on the column: the table's own, or one on a partition or inheritance child below it unless the statement says `ONLY`. Refused with `dependent-view`, naming the views, when a view or materialized view reads the column, on a table the drop reaches. Refused with `dependent-policy`, naming the policies, when a row-level security policy reads the column, on a table the drop reaches or on another table through a subquery. Refused with `dependent-trigger`, `dependent-generated-column`, or `partition-key`, naming the objects, when a trigger's `UPDATE OF` list or `WHEN` condition names the column, a generated column reads it, or it is in a partition key, on a table the drop reaches. Refused with `cascading-drop` when the statement says `CASCADE`, which would also drop the views and policies that read the column. A `migrate --desired` drop reads the object again under the table's lock and refuses with `dropped-object-drift`, dropping nothing, if its definition is not the one the reviewed plan carried. On a partitioned table it drops the column from the parent and every partition, sub-partitions included, after locking the whole tree: it refuses with `dropped-column-partition-key` when the column is in the partition key of the parent or of a sub-partitioned partition, and with `dropped-column-partition-dependent`, naming each object, when a partition carries an index, CHECK or foreign key, statistics object, sequence, or other object of its own on the column, which the parent's plan did not review; copies of the parent's indexes and constraints go with the parent's. On a table with inheritance children it refuses with `dropped-object-has-descendants`. `migrate --alter` makes no such partition check beyond the planner's `partition-key` refusal: the statement the operator wrote drops a partition's own objects on the column, as it drops the table's own."
  - id: alter-column-type-binary-coercible-proven-against-live-column-facts
    area: "column_changes"
    operation: "`ALTER COLUMN TYPE`, binary-coercible (proven against live column facts)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Catalog relabel, e.g. `varchar(50)` → `varchar(100)`, `varchar` → `text`, `timestamp(3)` → `timestamp(6)`, `varbit(8)` → `varbit(16)`, `cidr` → `inet`; refused with `dependent-view`, naming the views, when a view or materialized view reads the column, and with `dependent-policy`, naming the policies, when a row-level security policy reads it; refused likewise with `dependent-trigger`, `dependent-generated-column`, or `partition-key` when a trigger's `UPDATE OF` list or `WHEN` condition names it, a generated column reads it, or it is in a partition key; PostgreSQL itself refuses the change when a rule depends on it — see [binary-coercible-type-changes.md](binary-coercible-type-changes.md#no-rewrite-is-not-no-cost)"
  - id: alter-column-type-general-or-with-using
    area: "column_changes"
    operation: "`ALTER COLUMN TYPE`, general (or with `USING`)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "copy_and_swap"
    maturity: "preview"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Table rewrite; runs through copy-and-swap: the changed shape is built as a shadow table, filled in chunks (a `USING` expression is applied per row), verified, and swapped in under the source's name. The route is in preview and runs only when the run opens it with `--copy-and-swap` (`CopySwapOptions.Enabled`); without it the statement is refused with `copy-and-swap-refused`, cause `copy-and-swap-not-enabled`, before the route's preflight runs or anything is written. Refused with `dependent-view`, naming the views, when a view or materialized view reads the column, and with `dependent-policy`, naming the policies, when a row-level security policy reads it, and likewise with `dependent-trigger`, `dependent-generated-column`, or `partition-key` when a trigger's `UPDATE OF` list or `WHEN` condition names it, a generated column reads it, or it is in a partition key, before the route runs. The route's preflight still refuses table shapes and environments it cannot run against (`copy-and-swap-refused`); `migrate --dry-run` and `migrate --desired --dry-run` end in the same refusal for a table in a partition or inheritance tree (`copy-and-swap-partitioned`). A `USING` expression is admitted only when the copy can reproduce it: immutable, naming only the retyped column, not the primary key (`shadow-statement-conversion`). A statement that also drops a column and adds one of the same name is refused when the copy cannot fill the new column — the primary key, a source identity column, or a column that refuses NULL with no default of its own or its domain's (`shadow-statement-readd`); a statement that also declares a new identity or `serial` column, re-added or kept, is refused with `shadow-statement-new-sequence` — see [limitations.md](limitations.md)"
  - id: set-default-drop-default-drop-not-null
    area: "column_changes"
    operation: "`SET DEFAULT` / `DROP DEFAULT` / `DROP NOT NULL`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only. `DROP NOT NULL` is flagged **destructive**: `migrate` refuses it with `destructive-change` unless `--allow-destructive` names the table, and `migrate --desired` runs it only when `--expect-fingerprint` also pins the reviewed plan. A `migrate --desired` drop reads the object again under the table's lock and refuses with `dropped-object-drift`, dropping nothing, if its definition is not the one the reviewed plan carried. A `migrate --desired` `DROP NOT NULL` on a partitioned table with partitions, or on a table with inheritance children, refuses with `dropped-object-has-descendants`: a partition can hold a `NOT NULL` of its own on the column, which the plan did not review."
  - id: set-not-null
    area: "column_changes"
    operation: "`SET NOT NULL`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Executed as the native four-step pattern: `ADD CONSTRAINT ... CHECK (col IS NOT NULL) NOT VALID` → online `VALIDATE` → `SET NOT NULL` (catalog flip, PG 12+) → drop the scaffold check"
  - id: rename-column-rename-table
    area: "column_changes"
    operation: "`RENAME COLUMN` / `RENAME TABLE`"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "the hazard is to the application, and no SQL exists for `migrate` to substitute"
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: not-native-safe-rewrite-required
    reason_notes: "Metadata-only for PostgreSQL but **app-breaking** across deployed instances: code still using the old name breaks the instant the rename commits, and no safer SQL exists to substitute. Without `--force`, `migrate` refuses it as `rewrite-required`, class `by-design`, with the `expand-contract-column` or `coordinated-table-rename` guidance (and `lint` reports it at error severity). `--force SCHEMA.TABLE` runs the rename as submitted under bounded budgets and records the override; above `--max-table-size` the forced rename is refused as `not-native-safe-table-too-large`. A desired file cannot express a rename — `diff` shows a renamed column as a drop and an add"
  - id: set-tablespace
    area: "column_changes"
    operation: "`SET TABLESPACE`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: backend-unavailable
    reason_notes: "Physical relocation is a rewrite; routes to copy-and-swap, which does not carry a tablespace move yet. A partitioned parent has no storage to move: see the partitioned-parent `SET TABLESPACE` row"
  - id: add-primary-key-add-unique-plain-key-columns
    area: "constraints"
    operation: "`ADD PRIMARY KEY` / `ADD UNIQUE` (plain key columns)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Rewritten to the online sequence: `CREATE UNIQUE INDEX CONCURRENTLY` → `ADD CONSTRAINT ... USING INDEX`. The sequence carries the key's `INCLUDE` columns, `NULLS NOT DISTINCT`, `WITH (...)` storage parameters, and index tablespace onto the index, and `DEFERRABLE` / `INITIALLY DEFERRED` onto the attach. A storage parameter the sequence cannot render faithfully (a value that is not a plain word, number, or string, a value containing a backslash, or a namespaced parameter name) gets no rewrite and is refused as `rewrite-required` with the `unique-index-then-constraint` guidance: build the index with it, then attach it. In a desired file, a new key whose name and index match a valid live unique index takes that index over with `ADD CONSTRAINT ... USING INDEX` at the key's declared deferrability, instead of a destructive drop and rebuild. Execution reads the index again under the table's lock and refuses with the permanent `adopted-index-drift` code, attaching nothing, if it was dropped, replaced, or left invalid since planning"
  - id: add-primary-key-add-unique-on-a-partitioned-parent
    area: "constraints"
    operation: "`ADD PRIMARY KEY` / `ADD UNIQUE` on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_planned_flow"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "PostgreSQL refuses `ADD CONSTRAINT ... USING INDEX` on a partitioned table, and a plain `ADD CONSTRAINT` builds every partition's index under `ACCESS EXCLUSIVE` on the whole tree, so `migrate --alter` runs a lone named `ADD CONSTRAINT name {PRIMARY KEY | UNIQUE} (columns)` on a partitioned parent as the partitioned key build: each partition's unique index is built concurrently and given the constraint with `ADD CONSTRAINT ... USING INDEX`, then the parent's plain `ADD CONSTRAINT` adopts them in one brief transaction that builds nothing. The partitions are listed when the run executes, each step commits on its own, an advisory lock refuses a second pg-sprite run on the same table, and the same statement run again resumes from the partition constraints already finished. Refused before anything is created, with `unsupported-statement`: an unnamed constraint or one with `INCLUDE`, `NULLS NOT DISTINCT`, `DEFERRABLE`, `WITH (...)`, or `USING INDEX TABLESPACE` (`capability-boundary`), a key that lacks a partition key column (`by-design`), a parent that already has a primary key or another object under the name, or a primary key over a column that allows `NULL` (`environmental`), and a tree with a sub-partitioned partition (`capability-boundary`), each only while the run has changed nothing (a stop after a partition's index build began is a failed verdict with the executor's code); the dry run reports the shape, partition key, and sub-partitioned tree refusals too, while the parent and nullable column checks are read only under the build's lock, so for those the dry run reports `execute` and the apply refuses. The blocking form is never run as submitted: `--force` meets the `unsupported-partitioned-parent` refusal instead of the build. A primary key or unique constraint a desired file adds to a partitioned parent takes the same route: `diff` plans it schema-qualified as the partitioned key build (`execution: partitioned-key-build`; an unnamed constraint carries the server's default name), `migrate --desired` runs it as the build with the same verdicts, and a partition's valid unique index of the key's definition, attached to nothing, is given the constraint instead of a new build. A primary key over a column the table allows to be `NULL` is planned after the `SET NOT NULL` the file implies. A desired key that lacks a partition key column, or on a tree with a sub-partitioned partition, refuses the whole plan before its first statement, in `migrate --desired --dry-run` too, so nothing planned ahead of it commits. A desired key the build does not carry (`INCLUDE`, `NULLS NOT DISTINCT`, `DEFERRABLE`, `WITH (...)`, `USING INDEX TABLESPACE`) keeps the plain table's plan and is refused with `unsupported-partitioned-parent`. A live index of the parent under the key's name is not adopted, since the build refuses a parent that has one: the plan drops it, a blocking drop that runs only under `--accept-blocking`, and then builds the key. See [partitioned-index-build-design.md](partitioned-index-build-design.md#primary-key-and-unique-constraints)"
  - id: add-check-add-foreign-key-imperative
    area: "constraints"
    operation: "`ADD CHECK` / `ADD FOREIGN KEY` (imperative)"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Rewritten to the online sequence: `ADD CONSTRAINT ... NOT VALID` (brief metadata lock) → `VALIDATE CONSTRAINT` (writes keep flowing during the scan). An unnamed constraint is given the name PostgreSQL would choose (`<table>_<column>_check`, `<table>_check`, `<table>_<columns>_fkey`, numbered `check1`, `fkey1`, ... past a name another constraint in the schema already holds), because the `VALIDATE` step has to name it"
  - id: add-constraint-not-valid-using-index-validate-constraint
    area: "constraints"
    operation: "`ADD CONSTRAINT ... NOT VALID` / `... USING INDEX` / `VALIDATE CONSTRAINT`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Already the online idiom; executed as-is. `VALIDATE CONSTRAINT` is the idiom only beside operations that take `SHARE UPDATE EXCLUSIVE` alone, such as another `VALIDATE` or `SET STATISTICS`, and such a statement runs under the same validate budget as a lone `VALIDATE`: beside any other operation in one `ALTER TABLE`, it scans under that statement's strongest lock, so the statement is refused with `rewrite-required` until it is split. `lint` flags a `VALIDATE` in the same transaction block as an earlier statement that locked the table against reads or writes (`validate-in-transaction`)"
  - id: add-foreign-key-not-valid-on-a-partitioned-parent
    area: "constraints"
    operation: "`ADD FOREIGN KEY ... NOT VALID` on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    min_server_major: 18
    online_safety_problem: true
    online_safety_detail: "server version 18 or later"
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Supported on version 18 and later; refused on 14–17 with an environmental class"
  - id: add-foreign-key-on-a-partitioned-parent
    area: "constraints"
    operation: "`ADD FOREIGN KEY` on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_planned_flow"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "PostgreSQL 14–17 refuse `ADD FOREIGN KEY ... NOT VALID` on a partitioned table, and the plain statement validates every partition under `SHARE ROW EXCLUSIVE` on the whole tree, so on those versions a lone named `ADD CONSTRAINT name FOREIGN KEY (columns) REFERENCES schema.table (columns)` from `migrate --alter`, or a foreign key a desired file adds, runs as the partitioned foreign key build: each partition is given the foreign key `NOT VALID` and validated under `SHARE UPDATE EXCLUSIVE` while writes continue, then the parent's plain `ADD CONSTRAINT` adopts them in one brief transaction that holds `ACCESS EXCLUSIVE` on the referenced table. A rerun resumes from the partitions already finished. On PostgreSQL 18 the ordinary `NOT VALID` then `VALIDATE` sequence runs instead (previous row). `--force` runs the plain statement as written under the brief budgets. Every refusal and failure code, with its class, is in [the integration guide's outcomes table](schemabot-integration.md#outcomes-of-a-partitioned-foreign-key-build-1), and which of them a desired plan reports only when it runs is in [partitioned-foreign-key-design.md](partitioned-foreign-key-design.md#routing-from-a-desired-file)"
  - id: exclude-constraints-and-unrecognized-constraint-forms
    area: "constraints"
    operation: "`EXCLUDE` constraints (and unrecognized constraint forms)"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "unsolvable today"
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "No online pattern exists in PostgreSQL — the build scans under `ACCESS EXCLUSIVE` with no `NOT VALID`/`USING INDEX` equivalent. Refused; revisit only if PostgreSQL grows one"
  - id: drop-constraint
    area: "constraints"
    operation: "`DROP CONSTRAINT`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Metadata-only; flagged **destructive**. `migrate` refuses it with `destructive-change` unless `--allow-destructive` names the table, and `migrate --desired` runs it only when `--expect-fingerprint` also pins the reviewed plan. Refused with `replica-identity` when the constraint owns the table's replica identity index, or the index a partition's is attached under; under `REPLICA IDENTITY DEFAULT` that is the primary key, while a publication publishes the table's updates or deletes. Refused with `cascading-drop` when the statement says `CASCADE`, which would also drop other tables' foreign keys on the constraint. A `migrate --desired` drop reads the object again under the table's lock and refuses with `dropped-object-drift`, dropping nothing, if its definition is not the one the reviewed plan carried. On a partitioned table it drops the constraint from the parent and every partition, which hold it only as an inherited or cloned copy (a foreign key's clones included); on a table with inheritance children it refuses with `dropped-object-has-descendants`."
  - id: create-unique-index-on-a-plain-table-including-partial-expression-covering-include-gin-gist-brin
    area: "indexes"
    operation: "`CREATE [UNIQUE] INDEX` on a plain table — including partial, expression, covering (`INCLUDE`), GIN/GiST/BRIN"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "Executed as (or rewritten to) `CREATE INDEX CONCURRENTLY`, with validity verification, typed invalid-index outcomes, and a proven recovery for abandoned leftovers (`RebuildAbandonedIndex`, or `DropAbandonedIndex` to remove the leftover without rebuilding; both library-only; [runbook](invalid-index-recovery.md))"
  - id: drop-index
    area: "indexes"
    operation: "`DROP INDEX`"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "`migrate --alter` does not drive the online `CONCURRENTLY` form; `migrate --desired` drives it only for a pinned, acknowledged plan"
    front_doors:
      migrate: refused
      diff: supported
    refusal_reason: index-statement
    reason_notes: "`migrate --alter` never runs this statement online-safely: the plain form is refused and names `DROP INDEX CONCURRENTLY`, and the concurrent form is refused as already safe — run it directly against the database. `migrate --desired` runs an index drop its plan derived as `DROP INDEX CONCURRENTLY`, never holding the table's lock, when `--expect-fingerprint` pins the reviewed plan and `--allow-destructive` names the table; it reads the index again on the dropping session and refuses with the permanent `dropped-index-drift` code, dropping nothing, if the index is gone, invalid, now backs a constraint, or no longer has the definition the plan carried, and refuses the replica identity index. A desired file that removes or changes an index a foreign key references is refused at plan time with `referenced-index`, naming the key to drop or change first. A single-index plain `DROP INDEX` without `CASCADE` can be run as-is under bounded budgets with `--accept-blocking SCHEMA.TABLE` plus `--allow-destructive SCHEMA.TABLE` for the loss (exit 3, never 0; without the second acknowledgement it is refused with `destructive-change`); `--accept-blocking` checks the replica identity under the table's lock and refuses the drop as `unsupported-statement`, naming the identity index. `diff` reports an index to remove as a **destructive** `DROP INDEX` and its note that `migrate` will run `DROP INDEX CONCURRENTLY` holds for `migrate --desired` under the pin and acknowledgement above, not for `migrate --alter`. `diff` refuses dropping the table's replica identity index, or one a partition's is attached under, with `replica-identity`. `plan` and `lint` refuse `DROP INDEX … CASCADE` with `cascading-drop`, since `DROP INDEX CONCURRENTLY` does not accept `CASCADE`. An index of a partitioned table has no concurrent form: PostgreSQL rejects `DROP INDEX CONCURRENTLY` for it in every supported version, and a partition's own index cannot be dropped alone. `diff` therefore refuses such a drop with `unsupported-partitioned-parent` (class `by-design`, `blocking_passthrough_eligible: true`; preflight cause `parent-concurrent-index-drop`), and offers no concurrent rewrite; the statement carries the plain `DROP INDEX` as its `exec_sql` with `execution: blocking-index-drop`, which the fingerprint covers. `migrate --desired` runs it only when `--expect-fingerprint` pins the reviewed plan and `--allow-destructive` and `--accept-blocking` both name the table, with an explicit `--statement-timeout` longer than `--lock-timeout`: in one engine-owned transaction it requests the parent's lock under the lock budget (an exhausted budget refuses, nothing dropped), reads the index again (`dropped-index-drift` if it changed), drops it, and reads back that every partition's index went with it; the run ends `executed-without-online-safety` (exit 3). Without `--accept-blocking` the plan is refused with `destructive-change`, the detail naming the flags. `migrate --alter` reads the index's kind from the catalog before it refuses a single-index `DROP INDEX` (and so does its `--dry-run`): for a partitioned index both the plain and the `CONCURRENTLY` form are refused with that same reason and cause, with no `safer_idiom`, and the detail names the bounded path. The drop is the plain `DROP INDEX` under `migrate --alter --accept-blocking SCHEMA.TABLE --allow-destructive SCHEMA.TABLE` (exit 3), which takes `ACCESS EXCLUSIVE` on the parent, every partition, and every partition's index for as long as the drop runs, and its verdict says so; the `CONCURRENTLY` form stays refused under those flags. A partition's index attached under a parent index is refused in either form, flags or not, as `unsupported-statement` (class `by-design`), naming the root partitioned index to drop instead. When the index it comes down to is owned by a primary key, unique, or exclusion constraint, the drop is refused the same way, naming the `ALTER TABLE ... DROP CONSTRAINT` that removes it"
  - id: reindex
    area: "indexes"
    operation: "`REINDEX`"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "the online form is a direct `CONCURRENTLY` statement that `migrate` does not drive"
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: index-statement
    reason_notes: "`migrate` never runs this statement online-safely: the plain form is refused and names `REINDEX ... CONCURRENTLY`, and the concurrent form is refused as already safe — run it directly against the database. A plain `REINDEX INDEX` or `REINDEX TABLE` can be run as-is under bounded budgets with `--accept-blocking SCHEMA.TABLE` (exit 3, never 0). `REINDEX SCHEMA`, `DATABASE`, and `SYSTEM` stay refused. A desired schema cannot express a reindex, so `diff` never produces one"
  - id: alter-index-rename
    area: "indexes"
    operation: "`ALTER INDEX ... RENAME TO`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: not_applicable
    reason_notes: "Metadata-only: application SQL names tables and columns, not indexes. `migrate` resolves the index's owning table from the catalog, preflights and privilege-checks that table, and runs the rename under the brief budgets after locking the table in `SHARE UPDATE EXCLUSIVE` and re-checking that the name is still a plain index of it, then confirms before the commit that the index now carrying the new name is the one it checked, since the rename locks only the index and another session can move the name meanwhile (else the permanent `renamed-index-drift` code, nothing renamed — `ALTER INDEX ... RENAME` would also rename a table). An index that backs a primary-key, unique, or exclusion constraint renames the constraint, which `ON CONFLICT ON CONSTRAINT` names, so it is refused as `rewrite-required` (`app-breaking-rename`, guidance `coordinated-constraint-rename`); `--force` does not apply to an index rename. It changes only the catalog, so the table-size guard does not refuse it on a large table. Offline `lint` cannot tell the two kinds of index apart and reports neither. A desired file cannot express a rename"
  - id: index-build-on-a-partitioned-parent
    area: "indexes"
    operation: "Index build on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_planned_flow"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "PostgreSQL has no parent-level `CONCURRENTLY`, so a `CREATE INDEX` on a partitioned parent runs as the partition-aware build: `CREATE INDEX ON ONLY` the parent, then `CREATE INDEX CONCURRENTLY` on each partition, then `ATTACH PARTITION`. The partitions are listed when the run executes, each step commits on its own, the parent's `ON ONLY` step blocks writers for one catalog insert, and an advisory lock refuses a second pg-sprite run on the same table. The same statement run again resumes from the invalid parent index and the partition indexes already built, and `migrate --desired` plans that same `CREATE INDEX` when the live parent carries an invalid index with the desired definition. It needs a named index, no `IF NOT EXISTS`, and no `TABLESPACE`, which would place the parent's index and not the partitions'; a unique index must contain the partition key of every partitioned table in the tree; one that does not is refused (`unsupported-statement`, `by-design`) before anything is created, in `--dry-run` too. The blocking form is never run as submitted: `--force` does not bypass that, and `--accept-blocking` does not reach it. See [partitioned-index-build-design.md](partitioned-index-build-design.md)"
  - id: add-constraint-using-index-on-a-partitioned-parent
    area: "indexes"
    operation: "`ADD CONSTRAINT ... USING INDEX` on a partitioned parent"
    tier: "t3"
    status_mark: "❌"
    engine_path: "none"
    online_safety_problem: true
    online_safety_detail: "unsolvable today"
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-partitioned-parent
    reason_notes: "PostgreSQL does not support adopting an index on a partitioned parent in any supported version; refused before execution"
  - id: create-table-partition-of
    area: "partitioned_tables"
    operation: "`CREATE TABLE ... PARTITION OF`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal at both doors: the imperative door does not take `CREATE TABLE`, and the declarative create path refuses the form at plan time and re-checks it at apply — attaching a partition takes a brief `ACCESS EXCLUSIVE` on the **parent**, which the greenfield absence proof does not cover. A desired file for a partition that already exists is refused before planning builds anything, since the scratch build would attach to the live parent, and a desired file that declares several partitions, or a parent with its partitions, is refused at parse as a `capability-boundary`. The partition-aware flow is planned"
  - id: attach-partition
    area: "partitioned_tables"
    operation: "`ATTACH PARTITION`"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: not_applicable
    refusal_reason: not-native-safe-rewrite-required
    reason_notes: "Without `--force`, a typed refusal with nothing executed: the attach scans the partition to validate its bound unless a validated `CHECK` already proves it, and the engine does not yet construct that proof. The safer idiom is surfaced as guidance: pre-prove the bound with a validated `CHECK` on the new table, exclude it with a validated `CHECK` on the parent's `DEFAULT` partition if it has one, build the parent's indexes on the new table first, a unique one backing its constraint through `USING INDEX`, and give it each of the parent's foreign keys, validated (`ADD ... NOT VALID`, then `VALIDATE`), so the attach neither scans nor builds. The new table must also carry the parent's `CHECK` constraints, under the same names and validated, and `NOT NULL` wherever the parent declares it, or the attach refuses it. `--force SCHEMA.TABLE` runs the blocking `ATTACH PARTITION` as submitted under bounded budgets, taking the blocking lock, and records the override. The classify-first flow that constructs the proof itself is planned. A desired schema cannot express an attach, so `diff` never produces one"
  - id: detach-partition-concurrently
    area: "partitioned_tables"
    operation: "`DETACH PARTITION [CONCURRENTLY]`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: not_applicable
    reason_notes: "The plain form is rewritten to `DETACH PARTITION ... CONCURRENTLY`, which takes `SHARE UPDATE EXCLUSIVE` on the table, so reads and writes of the other partitions keep running. It runs outside a transaction block under the brief budgets: `--lock-timeout` bounds each lock wait, the wait for transactions that still read the partition through the table included, and `--statement-timeout` the whole statement. Flagged **destructive**, since the partition's rows leave the table: `migrate` refuses it with `destructive-change` unless `--allow-destructive` names the table. A detach that stops after its first transaction committed fails with `partition-detach-interrupted` and leaves the partition detach-pending; running the same statement again finishes it with `DETACH PARTITION ... FINALIZE`. PostgreSQL detaches one partition of a table at a time, so while another partition is detach-pending the detach fails with `partition-detach-pending` before anything runs, naming that partition and its `FINALIZE`. PostgreSQL refuses a concurrent detach from a table with a `DEFAULT` partition, so both forms are refused there (`unsupported-statement`, `by-design`, in `--dry-run` too) before anything runs; `--force SCHEMA.TABLE` runs the plain `DETACH PARTITION` as submitted under bounded budgets, taking `ACCESS EXCLUSIVE` on the table and the partition. `DETACH PARTITION ... FINALIZE` itself is refused with `unsupported-statement`: rerun the statement that started the detach. A desired schema cannot express a detach, so `diff` never produces one"
  - id: set-tablespace-on-a-partitioned-parent
    area: "partitioned_tables"
    operation: "`SET TABLESPACE` on a **partitioned parent**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: not_applicable
    reason_notes: "Metadata-only: a partitioned parent has no storage, so PostgreSQL records the tablespace as the default for partitions created later, under a brief `ACCESS EXCLUSIVE` on the parent alone, and moves no existing partition or index. Runs as written under bounded locks. Moving an existing partition is a `SET TABLESPACE` on that partition, a rewrite refused as in the `SET TABLESPACE` row. `ALTER INDEX ... SET TABLESPACE` is not taken by the imperative front door. A desired file does not express a table's tablespace, so `diff` never produces one"
  - id: partitioned-parents-in-the-declarative-model
    area: "partitioned_tables"
    operation: "Partitioned parents in the **declarative model**"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "The model carries the parent's partition key. `pull` exports a parent as `CREATE TABLE ... PARTITION BY` with its indexes as plain `CREATE INDEX` statements on the parent (no `ON ONLY`), and `diff` of that file against the same parent plans no changes; `migrate --desired` runs a parent's in-place changes and creates a missing `PARTITION BY` parent. A different partition key is a typed refusal, and a new index on an existing parent runs as the partitioned index build, under the restrictions of the index-build row. Partitions, their bounds, and the partition topology are not modeled and stay owned outside the desired file: `pull` skips partitions and a desired file for one is refused. Export refuses a parent whose index is not attached on every partition, and a parent with row security"
  - id: partitioned-tables-in-copy-and-swap
    area: "partitioned_tables"
    operation: "Partitioned tables in **copy-and-swap**"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "copy_and_swap"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: copy-and-swap-refused
    reason_notes: "Root-vs-leaf publication semantics and per-partition swap; the copy-and-swap preflight refuses a partitioned parent, a partition, or a member of an inheritance tree (`copy-and-swap-partitioned`), and `migrate --dry-run` and `migrate --desired --dry-run` end in that same refusal (`copy-and-swap-unlogged` or `copy-and-swap-force-rls` instead when the table is also UNLOGGED or forces row security, which the preflight decides first); the plan `diff` prints still routes the change as `execute`, since it does not read the route's preflight"
  - id: plain-tables-their-indexes
    area: "declarative_model"
    operation: "Plain tables + their indexes"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "`diff`, `pull`, and desired-file rendering round-trip the canonical model. The model carries each index's validity (`pg_index.indisvalid`): on a plain table an invalid entry is a concurrent build that did not finish — abandoned, or still running — so a live entry with the desired name and definition does not deliver the desired index, and `diff` plans it as a `create-index` change. `diff` never emits a drop for an invalid entry, whatever the desired file says about its name: a plain `DROP INDEX` blocks the table and cannot tell abandoned debris from a build still in progress. Every invalid entry the diff observes and leaves in place is named on the plan report as an advisory (`invalid-index-rebuild` when the desired file names it, `invalid-index-undeclared` when it does not), outside the statements and the fingerprint, so an empty plan over such a table reads as 'no changes to run' rather than converged. A `pull`ed baseline of such a table therefore re-diffs to that one rebuild rather than to zero. On a partitioned parent an invalid index means unattached partition indexes, not an unfinished build, so validity plays no part in the parent's comparison"
  - id: declarative-not-valid-constraint
    area: "declarative_model"
    operation: "A live check constraint or foreign key left `NOT VALID`"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "The model carries each constraint's validity (`pg_constraint.convalidated`). A live constraint left `NOT VALID` with the desired definition, which an interrupted online add leaves behind, plans as one `VALIDATE CONSTRAINT` statement (`validate-constraint`), which scans under `SHARE UPDATE EXCLUSIVE` while writes keep flowing, instead of a destructive drop and re-add. The statement names only the constraint, so execution reads the constraint again under that same lock and refuses with the permanent `validated-constraint-drift` code, validating nothing, if it was dropped or replaced under the same name since planning. A foreign key plans as `validate-foreign-key` and runs the same way. `CREATE TABLE` ignores `NOT VALID`, so a desired file cannot declare it: for a check constraint, `pull` renders the validated definition, and the baseline re-diffs to that one validation rather than to zero. For a foreign key, a caller that renders foreign keys (`RenderOptions.ForeignKeys`) gets the validated definition the same way"
  - id: declarative-replace-constraint
    area: "declarative_model"
    operation: "A constraint whose definition changes under the same name"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "The old constraint keeps enforcing until the statement that installs the new one removes it, so the table never goes without the rule. A primary key or unique constraint builds its new index `CONCURRENTLY` as `<name>_new`, then one `ALTER TABLE` drops the old constraint and adds the new one `USING INDEX`, which renames the index to the constraint's name; a failed build leaves the old constraint in place and names the invalid index to drop. A check constraint is dropped and added `NOT VALID` in one `ALTER TABLE`, then validated by its own `VALIDATE CONSTRAINT`, which scans under `SHARE UPDATE EXCLUSIVE`; if existing rows break the new rule, the validation fails and the new rule stays `NOT VALID`, checking every new write. Execution checks the dropped constraint, the adopted index, and the validated constraint against the plan under the statement's own lock. A run that stopped after the build is picked up there: a valid `<name>_new` with the desired definition is swapped in, not built again. When `<name>_new` is otherwise taken by a desired or live object, the plan refuses with `replacement-index-name`. For an unfinished `<name>_new` an earlier attempt left, the refusal names the `DROP INDEX CONCURRENTLY` to run before planning again. The plan checks the name against the table's own objects; a relation elsewhere in the schema that holds it fails the build with `42P07` before the old constraint is touched. A plan that would drop a primary key or unique constraint a foreign key references, whether to replace it in place, to drop and re-add it, or because the file removes it, is refused at plan time with `referenced-index`, naming the foreign key to drop or change first, since PostgreSQL does not drop a key a foreign key depends on; a foreign key on the same table that the plan drops first no longer holds the key. A foreign key is replaced the same way as a check constraint: one destructive `ALTER TABLE` drops the old key and adds the new one `NOT VALID`, then `VALIDATE CONSTRAINT` checks the rows. A partitioned table, a change of constraint kind, and a diff that also drops or retypes a column on the table keep the drop and re-add, and the drop of a foreign key there is refused with `declarative-foreign-key` (see foreign keys a desired file no longer declares). A primary key replaced in place on a table whose diff also drops a `NOT NULL` it covered is swapped first, and the `NOT NULL` is dropped after the swap, since the old key owns its columns' `NOT NULL` until it is dropped"
  - id: declarative-replace-index
    area: "declarative_model"
    operation: "An index whose definition changes under the same name"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "A standalone index whose definition changes under the same name is replaced, never dropped first. Its new definition is built `CONCURRENTLY` as `<name>_new` while the old index keeps serving reads and, for a unique index, keeps rejecting duplicates. Once the build is valid, `DROP INDEX CONCURRENTLY` removes the old index, and `ALTER INDEX ... RENAME TO` (`rename-index`) gives the new one its name, so the table has an index with the desired definition before the old one goes; the drop stays destructive, since it removes whatever the desired definition no longer asks for. The drop carries `replaced_by`, naming the index that replaces it, and reads that index again right before it runs: if it is gone, invalid, or rebuilt with another definition, the drop refuses with `replacement-index-drift` and the old index stays. A failed build leaves the old index in place and names the invalid `<name>_new` to clear. A run that stopped part-way resumes where it stopped: a valid `<name>_new` with the desired definition is not built again, and when the old index is already gone the plan is the rename alone. When `<name>_new` is taken by another index, or by a desired or live constraint, the plan refuses with `replacement-index-name`. So it does when the old index is invalid beside a valid `<name>_new` with the desired definition, which an interrupted `DROP INDEX CONCURRENTLY` of the old index leaves: the refusal names that drop, and the next plan is the rename alone. An index a foreign key references is refused with `referenced-index`, naming the key, since PostgreSQL does not drop an index a key depends on. A partitioned table, and a diff that also drops or retypes a column on the table, keep the drop and rebuild"
  - id: declarative-rename-index
    area: "declarative_model"
    operation: "An index, unique constraint, or rule that moves to another name"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "A desired index whose definition matches a live index's except for its name is renamed in the catalog with `ALTER INDEX ... RENAME TO` (`rename-index`), so the index keeps serving and, for a unique index, keeps rejecting duplicates; nothing is dropped or built. An invalid live index or an unfinished build is never renamed. Execution reads the index again under the table's `SHARE UPDATE EXCLUSIVE` lock and refuses with `renamed-index-drift`, renaming nothing, if it now backs a constraint or no longer has the definition the plan matched it by. When a uniqueness or a rule moves to another name or another kind of object, such as a unique constraint declared again as a unique index or a check constraint under a new name, the plan builds or adds the replacement first and drops the old object after it: a build that fails, such as a unique index the existing rows break, leaves the old object enforcing. The same holds when the replacement keeps a live name and only its definition changes, such as a plain index the file makes unique. Under the same name, the new index is built as `<name>_new` first: a unique constraint the file declares as a standalone index is dropped once the build is valid, and the index renamed to its name; a standalone index the file declares as a unique constraint is dropped with `DROP INDEX CONCURRENTLY`, and the constraint takes over the build with `ADD CONSTRAINT ... USING INDEX`. Either drop reads `<name>_new` again first and refuses with `replacement-index-drift` if it is gone, invalid, or rebuilt. A plan that also drops or retypes a column keeps the drops first, since the column takes its indexes and constraints with it, and a primary key under a new name is dropped first, since a table has only one. A unique or primary-key constraint under a new name is not renamed in place. Two shapes are refused at plan time, because the old index would go before its rule is held elsewhere: a new constraint that takes the name of a live index the file renames (`renamed-index-name`), and a new constraint that takes the name of a live unique index whose key another unique index the plan builds also makes unique, with or without a predicate (`moved-unique-rule`). Each lands as two changes: the rename or the new index first, then the constraint"
  - id: declarative-unnamed-check-numbering
    area: "declarative_model"
    operation: "Unnamed check constraints whose generated names differ from the live table's"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "PostgreSQL names an unnamed check constraint `<table>_<column>_check` when it reads exactly one column and `<table>_check` otherwise, and adds a number (`<table>_check1`, ...) when another constraint in the schema already holds that name, so a table built by a history of statements and the same table built from one desired file can hold identical checks under shifted names. A check the desired file declares without a name is matched to a live check constraint by definition rather than by name, so a table that differs only in that numbering plans no changes instead of dropping and re-adding every shifted check. A live check whose name the file states is never matched to an unnamed one. An unnamed check with no live match is added under its generated name, or under the next free number when a matched check holds that name; when the next number would need the server's truncation to fit 63 bytes, the plan refuses with `ErrUnsupportedChange`. When a `LIKE` clause could copy constraints, every check keeps name matching"
  - id: classic-table-inheritance-inherits
    area: "declarative_model"
    operation: "Classic table inheritance (`INHERITS`)"
    tier: "t2"
    status_mark: "🟡"
    engine_path: "native_planned_flow"
    online_safety_problem: true
    front_doors:
      migrate: refused
      diff: refused
    refusal_reason: unsupported-statement
    reason_notes: "Typed refusal for both parents and children: the model cannot express inheritance edges, and flattening inherited columns would produce a silently lossy baseline. A desired file that declares `INHERITS` is refused before planning builds anything, since the scratch build would lock the live parent and add an inheritance edge to it"
  - id: declarative-foreign-key-add
    area: "declarative_model"
    operation: "Foreign keys a desired file adds, on a live table or a new one"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_safer_sequence"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "A desired file may declare a foreign key to an unqualified table that exists in the target schema, or to its own table. `diff` shows a matching foreign key as no change. A key the file adds to a live table plans as `add-foreign-key` and runs as two autocommitted steps: `ADD CONSTRAINT ... NOT VALID`, a brief `SHARE ROW EXCLUSIVE` lock on both tables that checks no existing row, then `VALIDATE CONSTRAINT`, which scans under `SHARE UPDATE EXCLUSIVE` while writes keep flowing. A row that breaks the key fails the validation with the key left `NOT VALID`, still enforced for new writes; once the rows are fixed, the next plan is that one validation. On a partitioned table before PostgreSQL 18 the key plans and runs as the partitioned foreign key build instead (see the `ADD FOREIGN KEY` on a partitioned parent row). A `CREATE TABLE` that declares a foreign key runs as written, since the new table is empty, under the same brief lock budget as every create. Planning binds each reference to an empty scratch copy of the live table, which needs `SELECT` on it, so planning takes only `ACCESS SHARE` on the live referenced table. Export refuses both sides by default. A caller that opts in with `RenderOptions.ForeignKeys` gets each table's own foreign keys written out, and must render the referencing tables too, because an incoming FK lives in the referencing table's file. Export still refuses an FK into another schema, an FK from a table to itself whose referenced columns have no immediate primary key or `UNIQUE` constraint (only a standalone unique index, or only a deferrable constraint beside one), and an FK on a table rendered with `RenderOptions.RowSecurity` (`statement.ErrRowSecurityForeignKey`)"
  - id: declarative-foreign-key-drop
    area: "declarative_model"
    operation: "Foreign keys a desired file no longer declares, or declares differently"
    tier: "t1"
    status_mark: "✅"
    engine_path: "native_as_is"
    maturity: "ga"
    online_safety_problem: true
    front_doors:
      migrate: supported
      diff: supported
    reason_notes: "A live foreign key the desired file leaves out plans as a `drop-foreign-key` statement, flagged **destructive**: `migrate --desired` runs it only when `--allow-destructive` names the table and `--expect-fingerprint` pins the reviewed plan. The drop changes only the catalog, but it takes `ACCESS EXCLUSIVE` on both the table and the referenced table, under the brief lock budget, and re-reads the key's definition under that lock, so a key replaced under the name since the plan is refused with `dropped-object-drift`. A live key into another schema, or a key from a table to itself whose referenced columns are unique only through a standalone unique index, cannot be declared, so its drop is refused with `declarative-foreign-key`, and `migrate --alter` removes it. A key the file moves to a new name is added and validated before the old one is dropped. A validation that fails leaves both keys: the old one valid, and the new one `NOT VALID` but checking every new write. Once the rows are fixed, the next plan validates the new key and drops the old one; a file that takes the new key out plans its drop instead. A key changed under the same name is replaced by one destructive `ALTER TABLE` that drops it and adds the new definition `NOT VALID`, so every write stays checked by one key or the other, and then validated; a validation that fails leaves the new key `NOT VALID`, checking every new write, and the next plan validates it once the rows are fixed. On a partitioned table the old key would be dropped before the new one is added, leaving writes checked against no key in between, so that drop is refused with `declarative-foreign-key`; declaring the changed key under a new name adds it first. The same drop is refused in a plan that adds a foreign key and also drops or retypes a column, since that plan keeps its drops first"
